name: "Setup tx3 Toolchain"
description: "Install the tx3 toolchain using tx3up"
branding:
  icon: "download"
  color: "blue"

inputs:
  channel:
    description: "Toolchain channel to install (stable, nightly, beta)"
    required: false
    default: "stable"
  version:
    description: "Specific toolchain release tag to install (e.g. 'sha-3f2296a'). If not set, installs the latest for the channel."
    required: false
    default: ""
  github-token:
    description: "GitHub token for API requests (avoids rate limits)"
    required: false
    default: ${{ github.token }}

outputs:
  tx3-version:
    description: "The installed tx3c compiler version (e.g. '0.25.0')"
  trix-version:
    description: "The installed trix version (e.g. '0.28.0')"
  bin-path:
    description: "Path to the installed toolchain binaries"

runs:
  using: "node20"
  main: "dist/index.js"
