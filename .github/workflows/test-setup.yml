name: Test Setup Action

on:
  push:
    branches: [main]
    paths:
      - "setup/**"
      - ".github/workflows/test-setup.yml"
  pull_request:
    paths:
      - "setup/**"
      - ".github/workflows/test-setup.yml"

jobs:
  test-setup:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Run setup action
        id: setup
        uses: ./setup

      - name: Verify tx3c is available
        run: |
          which tx3c
          tx3c --version

      - name: Verify trix is available
        run: |
          which trix
          trix --version

      - name: Check outputs
        run: |
          echo "tx3-version: ${{ steps.setup.outputs.tx3-version }}"
          echo "bin-path: ${{ steps.setup.outputs.bin-path }}"
          test -n "${{ steps.setup.outputs.bin-path }}"

  test-channel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run setup action with nightly channel
        uses: ./setup
        with:
          channel: nightly

      - name: Verify installation
        run: tx3c --version
