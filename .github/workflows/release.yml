name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      - name: Verify dist/ is up to date
        run: |
          if [ -n "$(git diff --name-only setup/dist/)" ]; then
            echo "::error::setup/dist/ is out of date for tag ${GITHUB_REF_NAME}. Run 'npm run build' and commit before tagging."
            git diff --stat setup/dist/
            exit 1
          fi

      - name: Move major version tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          MAJOR="${TAG%%.*}"
          git tag -f "${MAJOR}" "${TAG}"
          git push origin "${MAJOR}" --force

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
